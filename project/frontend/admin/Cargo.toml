[package]
name = "admin-frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
derive_more = "0.99.17"
# The frontend framework
yew = {version = "0.21", features = ["csr"]}
yew-router = "0.18"
yew_icons = {version = "0.8", features = ["LucideLayoutDashboard", "BootstrapGraphUp", "LucideSettings", "BootstrapBuildingExclamation", "BootstrapPeople", "BootstrapTrash", "BootstrapPencil"]}
bounce = "0.9.0"
gloo = {version = "0.10.0", features = ["storage"]}
web-sys = {version = "0.3.106", features = ["HtmlTextAreaElement", "Element", "HtmlInputElement", "Document", "DomParser", "SupportedType", "HtmlCollection", "DragEvent", "DataTransfer", "FileList"]}
# A rust serialization library for interacting data between the backend and frontend
serde = { version = "1.0.188", features = ["derive"] }
common = {path = "../common"}
